# Kokoaa Shiny-sovelluksen shinylive-sivustoksi (R ajetaan selaimessa)
# ja julkaisee sen GitHub Pagesiin.
name: Julkaise Shiny-sovellus

on:
  push:
    branches: [claude/datacenter-investment-impact-f7k9ay]
    paths:
      - "app/**"
      - "datakeskus_vaikutukset.R"
      - ".github/workflows/shinylive.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib

      - name: Kokoa sivusto
        run: |
          cp datakeskus_vaikutukset.R app/
          Rscript -e 'shinylive::export("app", "site")'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
